<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator - FindLib UNSIKA</title>
  <link rel="icon" type="image/png" href="/images/unsika.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0B192C 0%, #1E293B 50%, #0F172A 100%);
      padding: 24px;
      position: relative;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #0B192C;
      font-weight: 800;
      font-size: 1.8rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }

    .login-alert {
      padding: 12px 16px;
      border-radius: 8px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #EF4444;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/images/unsika.png" alt="UNSIKA Logo"
          style="width: 72px; height: 72px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));">
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #0B192C;">Login Administrator</h2>
        <p style="font-size: 0.85rem; color: #64748B; margin-top: 4px;">FindLib UNSIKA &bull; Akses Pengelola
          Perpustakaan</p>
      </div>

      <div id="loginAlert" class="login-alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-user"></i> Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username admin" required
            autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            <button type="button" onclick="togglePasswordVisibility()"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer;">
              <i class="fa-solid fa-eye" id="pwdIcon"></i>
            </button>
          </div>
        </div>

        <div
          style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #475569;">
            <input type="checkbox" id="rememberMe"
              style="width: 16px; height: 16px; accent-color: #0284C7; cursor: pointer;">
            <span>Ingat Saya (7 Hari)</span>
          </label>
          <span style="color: #94A3B8; font-size: 0.78rem;">Sesi Aman</span>
        </div>

        <button type="submit" id="submitBtn" class="search-btn"
          style="width: 100%; padding: 13px; font-size: 1rem; background: #0284C7;">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard
        </button>

      </form>

      <div style="margin-top: 24px; text-align: center; border-top: 1px solid #E2E8F0; padding-top: 18px;">
        <a href="/" style="font-size: 0.85rem; color: #64748B; font-weight: 600; text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog Publik
        </a>
      </div>

    </div>
  </div>

  <script>
    // Ambil parameter redirect dari URL (misal: /login?redirect=/kiosk)
    const urlParams = new URLSearchParams(window.location.search);
    const targetRedirect = urlParams.get('redirect') || '/admin';

    // Cek jika sudah memiliki sesi login aktif
    document.addEventListener('DOMContentLoaded', async () => {
      const existingToken = localStorage.getItem('libnav_admin_token');
      if (existingToken) {
        try {
          const res = await fetch('/api/auth/verify', {
            headers: { 'Authorization': `Bearer ${existingToken}` }
          });
          const data = await res.json();
          if (data.authenticated) {
            window.location.href = targetRedirect;
          }
        } catch (e) {}
      }
    });

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('pwdIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa kredensial...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, rememberMe })
        });

        const result = await res.json();

        if (result.success) {
          localStorage.setItem('libnav_admin_token', result.token);
          localStorage.setItem('libnav_admin_user', JSON.stringify(result.user));
          window.location.href = targetRedirect;
        } else {
          alertBox.textContent = result.error || 'Username atau password salah!';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'Gagal menghubungi server. Pastikan server aktif.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard';
      }
    }
  </script>
</body>

</html>
